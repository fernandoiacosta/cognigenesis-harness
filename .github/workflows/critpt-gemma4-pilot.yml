name: Gemma 4 E2B — Public CritPt Reasoning Pilot

on:
  push:
    branches: [eval/critpt-gemma4-frameworks-20261030]
    paths:
      - .github/workflows/critpt-gemma4-pilot.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reasoning-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check available resources
        run: |
          free -h
          df -h .
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 1
          done
          exit 1
      - name: Download only approved Google Gemma 4 E2B
        run: |
          ollama pull gemma4:e2b
          ollama list
          curl -fsS http://127.0.0.1:11434/api/tags
      - name: Public CritPt Challenge 1 — three reasoning configurations, same JSON schema
        run: python experiments/003/critpt_public_probe.py --model gemma4:e2b --challenges 1 --timeout 420
      - name: Print diagnostic report
        if: always()
        run: |
          python -c "import json,pathlib; p=pathlib.Path('experiments/003/results/gemma4-critpt-public-probe.json'); d=json.loads(p.read_text()) if p.exists() else {}; print(json.dumps([{k:r.get(k) for k in ('case_id','condition','checks','error','latency_seconds','eval_count')} for r in d.get('records',[])],indent=2))"
      - name: Save raw results even if partial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-critpt-gemma4-frameworks-${{ github.run_id }}
          path: experiments/003/results/
          retention-days: 14
          if-no-files-found: ignore
