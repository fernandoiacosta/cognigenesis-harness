name: Gemma 4 E2B — frozen Experiment 001

on:
  push:
    branches:
      - eval/gemma4-e2b-20261029
    paths:
      - .github/workflows/gemma4-e2b-experiment-001.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemma-e2b:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check resources
        run: |
          free -h
          df -h .
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        shell: bash
        run: |
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/ollama.log"
          exit 1
      - name: Download ONLY Google Gemma 4 E2B
        run: |
          ollama pull gemma4:e2b
          ollama list
          curl -fsS http://127.0.0.1:11434/api/tags
          df -h .
      - name: Run unmodified frozen Experiment 001, all three seeds
        shell: bash
        run: |
          python experiments/001/run.py --model gemma4:e2b --runs 3 --temperature 0.2 --timeout 180
      - name: Print official report
        if: always()
        run: |
          find experiments/001/results -name report.json -exec cat {} \; 2>/dev/null || true
      - name: Save original raw output and scorer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-frozen-001-${{ github.run_id }}
          path: experiments/001/results/
          retention-days: 14
          if-no-files-found: ignore
