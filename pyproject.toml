[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognigenesis-harness"
version = "0.2.0"
description = "Minimal extensible agent runtime with a Markdown cognitive control plane and trust-gated capabilities."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cogni = "cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["cli", "harness"]

[tool.setuptools.packages.find]
include = ["core*", "providers*", "state*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
