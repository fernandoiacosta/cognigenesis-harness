[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognigenesis-harness"
version = "0.5.0"
description = "Local-first conversational Cognigenesis runtime with Ollama, trust-gated capabilities, terminal chat, and ACP stdio support for AionUi."
requires-python = ">=3.11,<3.15"
dependencies = [
  "agent-client-protocol>=0.12.1,<0.13",
]

[project.scripts]
cogni = "cli:main"
cogni-acp = "acp_bridge:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
py-modules = ["cli", "harness", "acp_bridge"]

[tool.setuptools.packages.find]
include = ["core*", "providers*", "state*", "tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
