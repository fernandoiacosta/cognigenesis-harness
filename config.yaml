runtime:
  max_steps: 12
  default_mode: architect
  provider: stub

workspace:
  root: workspace

policy:
  default: deny
  allow:
    - core.*
    - filesystem.*
    - workspace.*
    - shell.*

model_qualification:
  default_trust: observer
  require_profile: true
  capability_tiers:
    filesystem.read: basic
    filesystem.list: basic
    filesystem.write: trusted
    workspace.create_project: trusted
    shell.run: trusted
