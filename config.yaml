runtime:
  max_steps: 12
  default_mode: architect
  provider: ollama

ollama:
  base_url: http://127.0.0.1:11434
  model: llama3.1:8b
  timeout: 120
  env:
    base_url: COGNI_OLLAMA_BASE_URL
    model: COGNI_OLLAMA_MODEL
    timeout: COGNI_OLLAMA_TIMEOUT

workspace:
  root: workspace

policy:
  default: deny
  shell_enabled: false
  authoritative_source: core/capability_policy.py

model_qualification:
  default_trust: observer
  require_profile: true
  authoritative_source: core/model_profile.py
